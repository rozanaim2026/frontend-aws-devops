<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Details | LUCCI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.order-details-page{
  padding:60px 80px;
  background:#f8f8f8;
  min-height:60vh;
}
.order-details-page h2{
  font-family:'Playfair Display',serif;
  font-size:32px;
  margin-bottom:30px;
}
.order-summary-card{
  background:white;
  border-radius:10px;
  padding:30px 35px;
  max-width:900px;
  box-shadow:0 4px 20px rgba(0,0,0,0.05);
  margin-bottom:30px;
}
.order-meta-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
  gap:20px;
}
.order-meta-item label{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:#888;
  margin-bottom:6px;
}
.order-meta-item span{
  font-size:16px;
  font-weight:600;
  color:#222;
}
.status-badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
}
.status-placed{ background:#fff3cd; color:#856404; }
.status-paid{ background:#d4edda; color:#155724; }
.status-failed{ background:#f8d7da; color:#721c24; }
.status-default{ background:#e2e3e5; color:#383d41; }

.order-items-card{
  background:white;
  border-radius:10px;
  padding:30px 35px;
  max-width:900px;
  box-shadow:0 4px 20px rgba(0,0,0,0.05);
}
.order-items-card h3{
  font-family:'Playfair Display',serif;
  font-size:20px;
  margin-bottom:20px;
}
.order-item-row{
  display:flex;
  align-items:center;
  gap:24px;
  padding:18px 0;
  border-bottom:1px solid #eee;
}
.order-item-row:last-child{
  border-bottom:none;
}
.order-item-row img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
}
.order-item-info p{
  margin:0;
}
.order-item-info .item-name{
  font-size:16px;
  font-weight:600;
  color:#222;
  margin-bottom:6px;
}
.order-item-info .item-price{
  font-size:14px;
  color:#666;
}
@media (max-width:768px){
  .order-details-page{ padding:30px 20px; }
  .order-summary-card, .order-items-card{ padding:20px; }
}
</style>
</head>

<body>

<div id="navbar"></div>

<section class="order-details-page">
  <h2>Order Details</h2>
  <div id="orderDetails">
    <p>Loading order...</p>
  </div>
</section>

<script src="config.js"></script>
<script src="/src/navbar.js"></script>
<script src="src/app.js"></script>

<script>

function getOrderId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

fetch("components/navbar.html")
.then(res => res.text())
.then(data => {
  document.getElementById("navbar").innerHTML = data;
  if (typeof initNavbar === "function") {
    initNavbar();
  }
});

function statusBadgeClass(status){
  const s = (status || "").toUpperCase();
  if (s === "PLACED") return "status-placed";
  if (["PAID", "SUCCESS", "COMPLETED"].includes(s)) return "status-paid";
  if (s === "FAILED") return "status-failed";
  return "status-default";
}

async function loadOrderDetails() {

  const orderId = getOrderId();

  if (!orderId) {
    document.getElementById("orderDetails").innerHTML =
      "<p>Invalid order ID</p>";
    return;
  }

  const data = await apiRequest(`${ORDER_API}/orders/${orderId}`);

  console.log("📦 Order details:", data);

  if (!data || data.error) {
    document.getElementById("orderDetails").innerHTML =
      "<p>Failed to load order</p>";
    return;
  }

  let itemsHTML = "";

  if (data.items && data.items.length > 0) {
    data.items.forEach(item => {
      itemsHTML += `
        <div class="order-item-row">
          <img src="${item.image_url}" alt="${item.product_name}">
          <div class="order-item-info">
            <p class="item-name">${item.product_name}</p>
            <p class="item-price">₹${item.price} &nbsp;&times;&nbsp; ${item.quantity}</p>
          </div>
        </div>
      `;
    });
  } else {
    itemsHTML = "<p>No items found</p>";
  }

  document.getElementById("orderDetails").innerHTML = `
    <div class="order-summary-card">
      <div class="order-meta-grid">
        <div class="order-meta-item">
          <label>Order ID</label>
          <span>#${data.id}</span>
        </div>
        <div class="order-meta-item">
          <label>Total</label>
          <span>₹${data.total_amount}</span>
        </div>
        <div class="order-meta-item">
          <label>Status</label>
          <span class="status-badge ${statusBadgeClass(data.status)}">${data.status}</span>
        </div>
        <div class="order-meta-item">
          <label>Payment</label>
          <span class="status-badge ${statusBadgeClass(data.payment_status)}">${data.payment_status}</span>
        </div>
        <div class="order-meta-item">
          <label>Date</label>
          <span>${new Date(data.created_at).toLocaleDateString()}</span>
        </div>
      </div>
    </div>

    <div class="order-items-card">
      <h3>Items</h3>
      ${itemsHTML}
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", loadOrderDetails);

</script>

</body>
</html>

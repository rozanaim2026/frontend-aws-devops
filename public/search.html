<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LUCCI Search</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<section class="collection-page">
  <h2 class="collection-title">Search Products</h2>

  <div style="max-width:500px;margin:20px auto;text-align:center;">
    <input
      id="searchInput"
      type="text"
      placeholder="Search for products..."
      style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;font-size:16px;"
      autofocus
    >
  </div>

  <div id="products" class="products-grid"></div>
</section>

<!-- ✅ REQUIRED SCRIPTS -->
<script src="config.js"></script>
<script src="src/app.js"></script>
<script src="/src/navbar.js"></script>

<script>

/* ================= NAVBAR ================= */
fetch("components/navbar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;
    if(typeof initNavbar === "function"){
      initNavbar();
    }
  });

/* ================= STATE ================= */
let allProducts = [];

/* ================= FETCH ALL PRODUCTS (once) ================= */
apiRequest(`${PRODUCT_API}/products/`)
  .then(data => {
    if (!Array.isArray(data)) {
      console.error("Invalid data:", data);
      return;
    }
    allProducts = data;

    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get("q");
    if (initialQuery) {
      document.getElementById("searchInput").value = initialQuery;
      filterAndRender(initialQuery);
    }
  })
  .catch(err => console.error("FETCH ERROR:", err));

/* ================= LIVE SEARCH ================= */
const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("input", () => {
  filterAndRender(searchInput.value);
});

function filterAndRender(query){
  const q = query.trim().toLowerCase();

  if(!q){
    document.getElementById("products").innerHTML =
      "<p>Start typing to search products</p>";
    return;
  }

  const results = allProducts.filter(p =>
    p.name && p.name.toLowerCase().includes(q)
  );

  renderProducts(results);
}

/* ================= RENDER PRODUCTS ================= */
function renderProducts(products){

  const container = document.getElementById("products");

  if(!container){
    console.error("Products container not found");
    return;
  }

  container.innerHTML = "";

  if(products.length === 0){
    container.innerHTML = "<p>No products found</p>";
    return;
  }

  products.forEach(p => {

    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    let heart = wishlist.includes(p.id)
      ? '<i class="fa-solid fa-heart"></i>'
      : '<i class="fa-regular fa-heart"></i>';

    const card = document.createElement("div");
    card.className = "product-card";
    card.innerHTML = `
      <img src="${p.image_url}" class="product-img" />
      <div class="product-info">
        <h3>${p.name}</h3>
        <p class="price">₹${p.price}</p>
        <div class="product-actions">
          <button onclick="viewProduct(${p.id})">View</button>
          <button class="wishlist-btn"
            onclick="toggleWishlist(${p.id}, this)">
            ${heart}
          </button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

/* ================= VIEW PRODUCT ================= */
function viewProduct(id){
  window.location = `product-details.html?id=${id}`;
}

/* ================= WISHLIST ================= */
function toggleWishlist(id, btn){
  let list = JSON.parse(localStorage.getItem("wishlist")) || [];
  let index = list.indexOf(id);

  if(index === -1){
    list.push(id);
    btn.innerHTML = '<i class="fa-solid fa-heart"></i>';
  } else {
    list.splice(index,1);
    btn.innerHTML = '<i class="fa-regular fa-heart"></i>';
  }

  localStorage.setItem("wishlist", JSON.stringify(list));
}

</script>

</body>
</html>
